name: TEMP - Regenerate visual-regression snapshots

on:
  workflow_dispatch:

jobs:
  regen:
    name: Regenerate snapshots (Linux, matches production CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build React App
        run: npm run build-local
        env:
          REACT_APP_CAPTCHA_SITE_KEY: 'test-site-key'
          CI: false
      - name: Regenerate visual-regression snapshots
        run: npx playwright test tests/e2e/visual-regression.spec.ts --project=chromium --update-snapshots
      - name: Upload regenerated snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots
          path: tests/e2e/__screenshots__/visual-regression.spec.ts/chromium/*.png
          retention-days: 3
