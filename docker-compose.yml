# Local development dependencies for the booking engine.
#
#   docker compose up -d
#   npm run local:migrate
#   npm run local:api      # mock providers + booking API on :4000
#   npm start              # CRA on :3000, proxies /api to :4000
#
# Nothing here is used in AWS — production uses RDS, real Smoobu/PayPal, and S3.

services:
  postgres:
    # Matches infra/database.tf (engine_version = "15").
    image: postgres:15-alpine
    container_name: kalawala-postgres
    environment:
      POSTGRES_DB: kalawala
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      # Host 5433 keeps this clear of any other Postgres already on 5432
      # (other projects, or a native install). Container-side stays standard.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `npm run local:migrate` depends on this reporting healthy.
      test: ["CMD-SHELL", "pg_isready -U booking -d kalawala"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Stands in for the deposit-receipt S3 bucket. The AWS SDK talks to it over the
  # same API, so presigned PUT/GET behave as they do against S3. Doesn't check
  # credentials or signatures, so the dummy AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
  # in .env.local.example work as-is.
  s3mock:
    # MinIO locked its images down (already gone from Docker Hub; Quay started
    # 401ing every tag too, including pinned RELEASE ones) — S3Mock is a
    # maintained, freely-pullable stand-in that speaks the same S3 API.
    image: adobe/s3mock:latest
    container_name: kalawala-s3mock
    ports:
      # Container listens on 9090 (HTTP); kept on host :9000 so
      # S3_ENDPOINT_URL and everything downstream needs no change.
      - "9000:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the receipts bucket on first boot, then exits. (S3Mock's own
  # initialBuckets env var only takes effect on first PVC-backed boot, which
  # this ephemeral in-memory setup never has — a plain S3 PUT Bucket call is
  # simpler and works every time.)
  s3mock-init:
    image: curlimages/curl:latest
    container_name: kalawala-s3mock-init
    depends_on:
      s3mock:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      curl -sf -X PUT http://s3mock:9090/kalawala-deposit-receipts &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
